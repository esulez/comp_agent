name: Deploy competition-agent

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # agents deploy refuses a branch with no upstream; make main track origin/main
      - name: Fix git upstream
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git branch --set-upstream-to=origin/main main

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Sync project
        run: uv sync

      - name: Shut down previous deployment (if any)
        run: uv run agents shutdown competition-agent --yes || true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      # GITHUB_MEMORY_TOKEN is a *Mistral workspace secret* referenced by name only;
      # its value never passes through GitHub Actions or the repo.
      - name: Deploy to Mistral Cloud
        run: uv run agents deploy --name competition-agent --yes --secret-binding GITHUB_MEMORY_TOKEN=secret:workspace:GITHUB_MEMORY_TOKEN
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
